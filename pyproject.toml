[project]
name = "countersign-backend"
version = "0.1.0"
description = "Countersign backend: signed intent receipts and a dispute-defense agent for PayPal sellers"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "deepagents>=0.7.32",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.3",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "reportlab>=5.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["llm: calls a real LLM"]
addopts = "-m 'not llm'"
